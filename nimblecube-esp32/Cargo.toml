[package]
name = "nimblecube-esp32"
version = "0.1.0"
edition = "2021"

# Standalone workspace so the root `cargo build`/`test` ignores this Xtensa-only crate.
[workspace]

[dependencies]
esp-hal = { version = "1.1.1", features = ["esp32s3", "unstable"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3"] }
esp-backtrace = { version = "0.19.0", features = ["esp32s3", "panic-handler", "println"] }
esp-println = { version = "0.17.0", default-features = false, features = ["esp32s3", "jtag-serial"] }
nimblecube-core = { path = "../nimblecube-core" }
nb = "1.1.0"
esp-alloc = "0.10"

[[bin]]
name = "nimblecube-esp32"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = true
